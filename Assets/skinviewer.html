<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Viewer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        #skin_container {
            width: 100%;
            height: 100%;
        }
        #error_log {
            position: absolute;
            top: 0;
            left: 0;
            color: red;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }
        #skin_canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <div id="error_log"></div>
    <canvas id="skin_canvas"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.0.0-alpha.1/bundles/skinview3d.bundle.js"></script>
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            document.getElementById('error_log').innerText += '\n' + msg;
            return false;
        };
        
        window.addEventListener("unhandledrejection", function(event) {
            document.getElementById('error_log').innerText += '\nPromise Rejection: ' + (event.reason ? event.reason.toString() : 'Unknown');
        });

        let skinViewer = null;
        let pendingSkinUrl = null;
        let pendingModelType = null;

        window.loadSkin = function(skinUrl, modelType) {
            if (skinViewer) {
                skinViewer.loadSkin(skinUrl, { model: modelType }).catch(e => {
                    document.getElementById('error_log').innerText += '\nLoadSkin Error: ' + e.toString();
                });
            } else {
                pendingSkinUrl = skinUrl;
                pendingModelType = modelType;
            }
        };

        window.onload = function() {
            try {
                skinViewer = new skinview3d.SkinViewer({
                    canvas: document.getElementById("skin_canvas"),
                    width: window.innerWidth,
                    height: window.innerHeight,
                    skin: "https://minotar.net/skin/Steve.png"
                });

                // Make the animation run
                skinViewer.animation = new skinview3d.IdleAnimation();
                skinViewer.autoRotate = true;
                skinViewer.autoRotateSpeed = 0.5;

                if (pendingSkinUrl) {
                    skinViewer.loadSkin(pendingSkinUrl, { model: pendingModelType }).catch(e => {
                        document.getElementById('error_log').innerText += '\nPending LoadSkin Error: ' + e.toString();
                    });
                }

                window.addEventListener("resize", () => {
                    skinViewer.width = window.innerWidth;
                    skinViewer.height = window.innerHeight;
                });
            } catch (e) {
                document.getElementById('error_log').innerText += '\n' + e.toString();
            }
        };
    </script>
</body>
</html>
